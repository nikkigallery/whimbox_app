name: Build macOS App

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12.8'

jobs:
  build-pyinstaller-backend-mac:
    runs-on: macos-14
    steps:
      - name: Checkout Whimbox Backend
        uses: actions/checkout@v4
        with:
          repository: nikkigallery/Whimbox
          ref: feat_mac
          path: backend_src
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies and PyInstaller
        run: |
          cd backend_src
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller binary
        run: |
          cd backend_src
          python3 -m PyInstaller --onefile --name whimbox_backend --collect-all rapidocr_onnxruntime --collect-all rapidocr --collect-all langchain_core --collect-all numpy --collect-all cv2 --collect-all pyobjc --collect-all Foundation --collect-all AppKit --hidden-import cv2 --hidden-import ormsgpack --hidden-import ormsgpack.ormsgpack --hidden-import uuid_utils --hidden-import uuid_utils._uuid_utils --hidden-import numpy._core._multiarray_umath --hidden-import CoreFoundation --hidden-import Foundation --hidden-import pyclipper --hidden-import pyclipper._pyclipper --add-data "whimbox:whimbox" --add-data "$(python3 -c 'import rapidocr, os; print(os.path.dirname(rapidocr.__file__))'):rapidocr" whimbox/main.py
          
      - name: Run PyInstaller bundle smoke test
        run: |
          cd backend_src/dist
          ./whimbox_backend smokeTest
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whimbox_backend_mac
          path: backend_src/dist/whimbox_backend

  build-electron-mac:
    needs: build-pyinstaller-backend-mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download PyInstaller backend
        uses: actions/download-artifact@v4
        with:
          name: whimbox_backend_mac
          path: assets/

      - name: Restore execute permissions
        run: chmod +x assets/whimbox_backend

      - name: Build Electron app (macOS)
        run: pnpm build --mac

      - name: Flatten dist structure
        run: |
          mv dist/*/*.dmg dist/ || true
          mv dist/*/*.zip dist/ || true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-dmg
          path: dist/*.dmg

      - name: Upload ZIP installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-zip
          path: |
            dist/*.zip
            !dist/**/*.blockmap

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            !dist/**/*.blockmap
