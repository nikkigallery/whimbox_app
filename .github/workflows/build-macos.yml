name: Build macOS App

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12.8'

jobs:
  build-python-embedded-mac:
    runs-on: macos-14
    steps:
      - name: Cache Python embedded
        id: cache-python
        uses: actions/cache@v4
        with:
          path: python-embedded-mac
          key: python-embedded-mac-folder-${{ env.PYTHON_VERSION }}

      - name: Build Python embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          # Download official indygreg build for macOS arm64
          curl -L "https://github.com/indygreg/python-build-standalone/releases/download/20241206/cpython-3.12.8+20241206-aarch64-apple-darwin-install_only.tar.gz" -o python-embed.tar.gz
          tar -xzf python-embed.tar.gz
          
          # Rename folder
          mv python python-embedded-mac
          
          # Install pip, setuptools, wheel
          curl -L https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./python-embedded-mac/bin/python3 get-pip.py --no-warn-script-location
          ./python-embedded-mac/bin/python3 -m pip install setuptools wheel --no-warn-script-location

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-embedded-mac
          path: python-embedded-mac

  build-electron-mac:
    needs: build-python-embedded-mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download Python embedded
        uses: actions/download-artifact@v4
        with:
          name: python-embedded-mac
          path: assets/python-embedded-mac

      - name: Restore execute permissions
        run: chmod -R +x assets/python-embedded-mac/bin/

      - name: Build Electron app (macOS)
        run: pnpm build --mac

      - name: Flatten dist structure
        run: |
          mv dist/*/*.dmg dist/ || true
          mv dist/*/*.zip dist/ || true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-dmg
          path: dist/*.dmg

      - name: Upload ZIP installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-zip
          path: |
            dist/*.zip
            !dist/**/*.blockmap

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            !dist/**/*.blockmap
