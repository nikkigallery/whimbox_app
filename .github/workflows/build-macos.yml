name: Build macOS App

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12.8'

jobs:
  build-pyinstaller-backend-mac:
    runs-on: macos-14
    steps:
      - name: Checkout Whimbox Backend
        uses: actions/checkout@v4
        with:
          repository: nikkigallery/Whimbox
          ref: feat_mac
          path: backend_src
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies and PyInstaller
        run: |
          cd backend_src
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller binary
        run: |
          cd backend_src
          pyinstaller --onefile --name whimbox_backend --collect-all rapidocr_onnxruntime --collect-all langchain_core --collect-all numpy --hidden-import uuid_utils --hidden-import CoreFoundation --add-data "whimbox:whimbox" whimbox/main.py
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whimbox_backend_mac
          path: backend_src/dist/whimbox_backend

  build-electron-mac:
    needs: build-pyinstaller-backend-mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download PyInstaller backend
        uses: actions/download-artifact@v4
        with:
          name: whimbox_backend_mac
          path: assets/

      - name: Restore execute permissions
        run: chmod +x assets/whimbox_backend

      - name: Build Electron app (macOS)
        run: pnpm build --mac

      - name: Flatten dist structure
        run: |
          mv dist/*/*.dmg dist/ || true
          mv dist/*/*.zip dist/ || true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-dmg
          path: dist/*.dmg

      - name: Upload ZIP installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-zip
          path: |
            dist/*.zip
            !dist/**/*.blockmap

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            !dist/**/*.blockmap
