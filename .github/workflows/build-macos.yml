name: Build macOS App

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12.8'

jobs:
  build-python-embedded-mac:
    runs-on: macos-14
    steps:
      - name: Cache Python embedded
        id: cache-python
        uses: actions/cache@v4
        with:
          path: Python312.zip
          key: python-embedded-mac-${{ env.PYTHON_VERSION }}-aarch64

      - name: Build Python embedded
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          URL=$(curl -sL https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest | grep browser_download_url | grep aarch64-apple-darwin-install_only | grep cpython-3.12 | grep -v stripped | head -n 1 | cut -d '"' -f 4)
          echo "Downloading $URL"
          curl -sL "$URL" -o python-embedded.tar.gz
          tar -xzf python-embedded.tar.gz
          
          # Standalone python extracts to a folder named "python"
          ./python/bin/python3 -m pip install setuptools wheel --no-warn-script-location
          
          # Compress into Python312.zip preserving symlinks (-y)
          zip -ry Python312.zip python/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-embedded-mac
          path: Python312.zip

  build-electron-mac:
    needs: build-python-embedded-mac
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download Python embedded
        uses: actions/download-artifact@v4
        with:
          name: python-embedded-mac
          path: assets/

      - name: Build Electron app (macOS)
        run: pnpm build --mac

      - name: Flatten dist structure
        run: |
          mv dist/*/*.dmg dist/ || true
          mv dist/*/*.zip dist/ || true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-dmg
          path: dist/*.dmg

      - name: Upload ZIP installer
        uses: actions/upload-artifact@v4
        with:
          name: whimbox-app-mac-arm64-zip
          path: |
            dist/*.zip
            !dist/**/*.blockmap

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            !dist/**/*.blockmap
